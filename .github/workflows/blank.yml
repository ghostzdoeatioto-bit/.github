# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          A Internet está cheia de perigos e golpistas que tentam enganar pessoas com diversas técnicas e práticas 
ilícitas. Conhecer os principais tipos de ataques ajuda a proteger seus dados e dispositivos pessoais. Cada 
ataque abaixo é explicado de forma simples, com exemplos práticos, casos reais e dicas de prevenção fáceis 
de entender. 
O que é: O phishing é um golpe no qual criminosos fingem ser pessoas ou empresas confiáveis para 
“pescar” suas informações pessoais. Eles enviam e-mails, SMS ou mensagens falsas com links ou anexos 
maliciosos. O nome phishing vem da ideia de “pescar” vítimas com uma isca atraente, do mesmo modo que 
pescadores usam iscas para fisgar peixes .
Exemplo/analogia: Imagine receber um e-mail que parece ser do seu banco pedindo para atualizar a sua 
senha. O link leva a um site falso que rouba seus dados – isso é phishing. 
Caso real: Em 2016, hackers russos criaram um e-mail falso de redefinição de senha (um phishing) e 
enganaram a equipe da campanha da candidata a presidência dos Estados Unidos, Hillary Clinton. Com isso, 
roubaram milhares de e-mails confidenciais . 
Como se proteger: Não clique em links ou abra anexos de e-mails suspeitos. Verifique sempre o remetente 
e desconfie de mensagens urgentes demais. Use filtros anti-spam e esteja atento: empresas sérias não 
pedem senha por e-mail. Não forneça informações pessoais. Use os protocolos de segurança para e-mails. 
Métodos de autenticação de e-mail, como registros SPF, DKIM e DMARC, ajudam a confirmar a origem da 
mensagem. Os proprietários de domínio podem configurar esses registros para dificultar que os invasores 
imitem seus domínios em um ataque de falsificação de domínio. 
