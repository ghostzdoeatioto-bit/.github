4. DdoS (Ataque de Negação de Serviço) Caso real: Em 2016, um grande ataque DDoS atingiu o serviço DNS da Dyn, derrubando sites populares 
como Twitter, Netflix e Spotify por horas. Ninguém invadiu as contas, mas os serviços ficaram inacessíveis 
para milhões de usuários. 
Como se proteger: Empresas utilizam redes distribuídas (CDNs), firewalls e servidores em nuvem que 
absorvem picos de tráfego. Para usuários, não há muito o que fazer diretamente além de entender que, se 
um site está fora do ar por conta de DDoS, é por notivos de ataques. Em geral, usar provedores confiáveis 
ajuda a reduzir a chance de ataque.
O que é: Nesse ataque, o invasor se insere secretamente na comunicação entre você e um serviço online 
ou uma rede Wi-Fi, “escutando” ou modificando o que vocês fazem sem perceber. O criminoso fica no meio 
da conexão, daí o nome “homem no meio”. 
Exemplo/analogia: É como se alguém estivesse interceptando suas cartas antes de entregá-las e lendo o 
conteúdo sem seu conhecimento. Outro exemplo, você acessa seu banco pelo Wi-Fi do café, mas um hacker 
criou um ponto de Wi-Fi falso. Ele intercepta seus dados de login enquanto aparenta passar tudo para o site 
do banco. 
Caso real: A Equifax, uma das maiores empresas de crédito dos EUA, sofreu uma violação de dados que 
expôs informações pessoais de mais de 147 milhões de pessoas. Embora o ataque tenha envolvido múltiplas 
falhas de segurança, uma das técnicas utilizadas foi a interceptação de tráfego entre usuários e servidores, 
característica de um ataque de Main in the Middle.
Prevenção: Sempre confira se o site usa HTTPS (cadeado na barra do navegador). Evite redes Wi-Fi 
públicas abertas sem senha; prefira usar VPN. Manter seu antivírus e firewall ativos também ajuda a 
bloquear esses ataques.
5. Main in the Middle (Homem no Meio) O que é: Um ataque de injeção SQL explora falhas em sites ou sistemas que usam banco de dados. O 
invasor insere código malicioso em campos de entrada (como formulários) para que o banco execute 
comandos indesejados. Basicamente, o criminoso “injeta” código SQL na aplicação para ler ou alterar dados 
privados no banco de dados. 
Exemplo/analogia: Imagine um questionário onde, além de responder normalmente, você consegue 
escrever instruções secretas que o sistema executa. É como pedir informação em uma biblioteca (site), mas 
alguém consegue colocar um pedido oculto no livro que rouba mais dados. 
Caso real: Em 2015, a operadora britânica TalkTalk sofreu um ataque de injeção SQL. Hackers conseguiram 
acessar o banco de dados e roubaram dados de muitos clientes. A empresa acabou pagando multa grande 
pelo vazamento. 
Como se proteger: Quem desenvolve sites deve sempre filtrar e validar todas as entradas de usuários para 
remover códigos (especialmente algo parecido com código SQL). Técnicas como consultas parametrizadas 
(prepared statements) ou uso de firewall de aplicações web podem bloquear injeções. Para usuários finais, 
não há ação específica, mas o ideal é navegar em sites confiáveis e ter senhas fortes, pois ataques assim 
visam falhas do site, não do usuário. 
O que é: No XSS, o invasor insere scripts (código) malicioso em sites legítimos. Quando você visita uma 
página comprometida, esse código é executado no seu navegador como se fosse parte do site, permitindo 
roubar dados (como cookies de sessão) ou tomar controle do que aparece na tela. 
Exemplo/analogia: É como alguém desenhar uma armadilha em um mapa de cidade. O site é o mapa 
confiável, mas o hacker desenha um atalho secreto que te leva para outro lugar (site malicioso). Por 
exemplo, em um site de compras, um criminoso pode injetar um código no campo de comentários, toda vez 
que alguém abre aquela página, o código envia os dados de login do visitante para o hacker . 
6. Injeção de SQL
7. Cross-Site Scripting (XSS) Caso real: Imagine clicar num link compartilhado nas redes sociais que leva a um site de notícias. Você vê o 
site normalmente, mas um script oculto no site captura seus cookies de login e os envia ao invasor. A vítima 
nem percebe nada errado. Muito comum esse tipo de ataque.
Como se proteger: Sites devem filtrar e remover scripts de entradas de usuários. Manter todo o software do 
site atualizado fecha várias brechas. Como usuário, desconfie de links estranhos em e-mails e em redes 
sociais. Use navegadores modernos atualizados e extensões que bloqueiam scripts de fontes 
desconhecidas. 
O que é: No ataque de força bruta, o criminoso tenta todas as combinações possíveis de senha até achar a 
certa. É um método antigo, mas ainda eficaz quando as senhas são fracas. É como um ladrão tentando 
arrombar um cadeado testando chave após chave até encontrar a certa. 
Exemplo/analogia: Pense em um cadeado de 6 dígitos: o hacker usa um programa que experimenta 
“000000, 000001, 000002, …” sem parar até acertar. Com computadores poderosos, até muitas 
combinações podem ser testadas rapidamente. 
Caso Real: Houve um caso no Brasil envolvendo senhas fracas no sistema do Conselho Nacional de Justiça 
8. Ataque de força bruta (quebra de senha) (CNJ), revelado em 2023 durante a CPI dos Atos Golpistas. Quem revelou foi o hacker Walter Delgatti Neto, 
conhecido como o “hacker de Araraquara”. Em depoimento à CPI, Delgatti afirmou que conseguiu acessar 
sistemas do CNJ usando senhas extremamente simples, como: 123mudar, CNJ123,123452, entre outras. 
Segundo Delgatti, após analisar o código dos sistemas por cerca de três meses, encontrou credenciais que 
permitiram acesso à intranet do CNJ. O objetivo era criar um falso mandado de prisão contra o ministro 
Alexandre de Moraes, como parte de um plano político para desacreditar o sistema judiciário e tentar anular o 
resultado das eleições. O caso expôs a fragilidade da segurança cibernética em órgãos públicos e gerou forte 
repercussão política e institucional. Esse episódio é um exemplo claro de como senhas fracas podem ser 
exploradas por meio de ataques de força bruta ou simples tentativa e erro, sem necessidade de técnicas 
sofisticadas.
Como se proteger: Use senhas longas e complexas (letras maiúsculas, minúsculas, números e símbolos). 
Não use palavras óbvias como “senha123”. Sempre ative a autenticação em dois fatores (2FA) quando 
possível, assim, mesmo que invadam sua senha, ainda precisarão de outro código extra. Sistemas podem 
limitar tentativas de login, bloqueando contas após algumas tentativas falhas. Nunca reutilize senhas em 
vários sites.
O que é: Engenharia social não é um ataque técnico, mas sim uma forma de manipular pessoas. Aqui, o 
inimigo explora a confiança, curiosidade ou medo da vítima para obter dados confidenciais ou acesso a 
sistemas. Os exemplos mais comuns são golpes por telefone, e-mail ou mesmo pessoalmente com a vítima, 
momento que o hacker finge ser alguém confiável e amigável buscando obter informações valiosas da vítima.
Exemplo/analogia: Já ouviu falar do golpe do “parente no hospital”? Alguém liga fingindo ser seu parente e 
pedindo dinheiro para remédio urgentemente? Essa pessoa desconhecida conseguiu informações suas como 
nome de familiares pelas redes sociais e usou a engenharia social para encontrá-las. Da mesma forma, um 
hacker pode fingir ser do suporte técnico pedindo sua senha ou acesso e tantas outras situações análogas 
que são comuns por parte dos atacantes contra vítimas.
Caso Real: Um exemplo real e marcante de ataque de engenharia social aconteceu com a empresária 
9. Engenharia Social Barbara Corcoran, jurada do programa Shark Tank, em 2020. Um cibercriminoso se passou por uma 
assistente de Barbara e enviou um e-mail ao contador dela solicitando o pagamento de uma fatura de quase 
US$ 400.000. O golpista usou um endereço de e-mail quase idêntico ao da assistente real e incluiu detalhes 
plausíveis sobre investimentos imobiliários. O golpe só foi descoberto depois que o contador respondeu ao e-
mail verdadeiro da assistente perguntando sobre a transação
Como se proteger: Desconfie de contatos inesperados. Não forneça senhas ou códigos a ninguém que você 
não conheça bem. Confirme pedidos urgentes por outro meio (por ex., ligue diretamente para quem 
supostamente pediu ajuda). Não clique em anúncios chamativos de ofertas imperdíveis. Ative autenticação 
multifator (2FA) sempre que possível para proteger contas.
O que é: Um ataque “Dia Zero” explora uma falha de segurança desconhecida pelo fabricante do software ou 
equipamento. No caso do software, os desenvolvedores têm “zero dias” para corrigir, pois os hackers
descobriram a falha antes da atualização existir . É o tipo de ataque mais difícil de detectar e prevenir, já que 
não há patch ou solução oficial no momento do ataque. 
Exemplo/analogia: Imagine que a fechadura da sua casa tem um ponto fraco secreto que só os ladrões 
conhecem. Até o fabricante da fechadura descobrir e fazer um novo modelo, qualquer um com a informação 
certa pode entrar. 
Caso Real: O Stuxnet foi um malware altamente avançado descoberto em 2010, projetado especificamente 
para sabotar as centrífugas de enriquecimento de urânio do Irã. Ele visava sistemas industriais controlados 
por controladores lógicos programáveis (PLCs) da Siemens, usados em instalações nucleares. O Stuxnet 
explorou quatro vulnerabilidades zero-day no Windows e uma no software da Siemens. Essas falhas 
permitiram que o malware se espalhasse nos sistemas.
Como se proteger: Mantenha o sistema operacional e aplicativos sempre atualizados assim que houver 
correções. Embora o patch não exista antes do ataque de dia zero, os desenvolvedores costumam lançar 
atualizações logo em seguida. Habilitar atualizações automáticas é a melhor forma de fechar as brechas 
rapidamente. Ferramentas de segurança modernas (que usam inteligência artificial) podem identificar 
comportamentos suspeitos mesmo sem um patch específico. Em suma, quanto mais vigilante (atento a 
10. Dia Zero (Zero-Day) atualizações e a notícias de segurança) você for, menor é o tempo em que fica vulnerável.
A Internet é cheia de riscos, mas você pode ficar muito mais seguro seguindo boas práticas simples. Use 
senhas fortes e únicas para cada site e prefira senhas geradas automaticamente. Ative a autenticação em 
dois fatores sempre que disponível. Mantenha o sistema e programas do computador/ celular sempre 
atualizados. Tenha antivírus confiável ativado e faça backups regulares dos seus arquivos importantes. 
Desconfie de ofertas ou mensagens milagrosas: se parecer mentira, provavelmente é cilada. Educar-se e 
ensinar aos outros (escola, família, amigos) sobre esses perigos é fundamental. Com cuidado, prudência e 
conhecimento, é possível navegar na rede com tranquilidade. Cada ataque tem seus truques, mas as 
defesas básicas (atenção, atualização e backups) ajudam contra quase todos. Estar informado é a melhor 
arma contra cibercriminosos. Tenha bons hábitos digitais no dia a dia e incentive outros a fazer o mesmo 
para uma um uso da Internet mais segura! 
